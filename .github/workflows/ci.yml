name: spvm3-SentinelAI CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Lint, Model Gate & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx ruff

      - name: Lint Python with Ruff
        run: |
          ruff check backend/ --select E9,F

      - name: Verify Model Gate
        run: |
          python -c "
          import sys; sys.path.append('backend')
          from detector import _load_xgb
          clf = _load_xgb()
          assert clf is not None, 'FATAL: Model gate check failed — classifier could not be loaded!'
          print('Model gate check passed: classifier loaded successfully.')
          "

      - name: Run Backend Pytest Suite
        run: |
          pytest backend/tests -v

      - name: Validate Standalone SOC Dashboard HTML
        run: |
          python -c "
          import os
          html_path = 'sentinelai_dashboard.html'
          assert os.path.exists(html_path), 'Dashboard HTML file is missing!'
          size = os.path.getsize(html_path)
          assert size > 20000, f'Dashboard HTML too small: {size} bytes'
          print(f'Dashboard HTML validated successfully: {size} bytes')
          "

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run Typecheck & Build Production Bundle
        run: |
          cd frontend
          npm run build
